name: publish-nap-core

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - run: cargo publish -p nap-core --dry-run
      # Publish via crates.io Trusted Publishing (OIDC): no API token.
      # Requires a trusted publisher on crates.io for crate `nap-core`
      # pointing at portalshq/narrativeengine + this workflow file (+ production env).
      - uses: rust-lang/crates-io-auth-action@v1
        id: auth
      - run: cargo publish -p nap-core
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
