name: cli-release

on:
  push:
    tags:
      - 'v*'
permissions:
  contents: read
jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: |
            typescript/narrativeengine/package-lock.json
            typescript/nap-sdk/package-lock.json
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: pip install ruff mypy pydantic
      - run: ruff check python/narrativeengine
      - run: mypy python/narrativeengine/narrativeengine
      - run: npm ci && npm run lint
        working-directory: typescript/narrativeengine

  test:
    name: Test
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run tests
        run: >
          cargo test
          --locked
          --workspace
          --exclude narrativeengine-py
          --exclude nap-sdk-py
          --exclude nap-sdk-ts

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bin: nap
            mcp_bin: nap-mcp-server
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            bin: nap
            mcp_bin: nap-mcp-server
          - os: macos-15
            target: x86_64-apple-darwin
            bin: nap
            mcp_bin: nap-mcp-server
          - os: macos-latest
            target: aarch64-apple-darwin
            bin: nap
            mcp_bin: nap-mcp-server
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bin: nap.exe
            mcp_bin: nap-mcp-server.exe

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2

      - name: Install target
        run: rustup target add ${{ matrix.target }}

      - name: Build
        run: cargo build --locked --release --target ${{ matrix.target }} --bin nap --bin nap-mcp-server

      - name: Prepare binary
        shell: bash
        run: |
          mkdir -p artifacts
          NAME="nap-${{ matrix.target }}"
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            NAME="${NAME}.exe"
          fi
          cp \
            "target/${{ matrix.target }}/release/${{ matrix.bin }}" \
            "artifacts/${NAME}"
          MCP_NAME="nap-mcp-server-${{ matrix.target }}"
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            MCP_NAME="${MCP_NAME}.exe"
          fi
          cp \
            "target/${{ matrix.target }}/release/${{ matrix.mcp_bin }}" \
            "artifacts/${MCP_NAME}"

      - uses: actions/upload-artifact@v4
        with:
          name: nap-${{ matrix.target }}
          path: artifacts/*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - run: bash -n scripts/install.sh
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - run: |
          cp scripts/install.sh artifacts/install.sh
          chmod +x artifacts/install.sh
      - working-directory: artifacts
        run: |
          # Write through a temporary file outside the artifact directory so
          # the checksum manifest can never include itself.
          MANIFEST="$(mktemp)"
          find . -maxdepth 1 -type f -print0 \
            | sort -z \
            | xargs -0 sha256sum > "$MANIFEST"
          mv "$MANIFEST" SHA256SUMS
      - uses: sigstore/cosign-installer@v3
      - name: Sign checksums and emit release metadata
        working-directory: artifacts
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          cosign sign-blob --yes --bundle SHA256SUMS.sigstore.json SHA256SUMS
          VERSION="${RELEASE_TAG#v}"
          LORE_VERSION="$(sed -n 's/^pub const PINNED_LORE_VERSION: &str = "\([^"]*\)";/\1/p' ../crates/nap-core/src/server/version.rs)"
          LORE_REPOSITORY="$(sed -n 's/^pub const PINNED_LORE_REPOSITORY: &str = "\([^"]*\)";/\1/p' ../crates/nap-core/src/server/version.rs)"
          LORE_INSTALLER_SHA256="$(sed -n '/^pub const PINNED_LORE_INSTALLER_SHA256:/{n;s/^[[:space:]]*"\([^"]*\)";/\1/p;}' ../crates/nap-core/src/server/version.rs)"
          LORE_ARTIFACT_MANIFEST_SHA256="$(sed -n '/^pub const PINNED_LORE_ARTIFACT_MANIFEST_SHA256: &str =/,/";$/{s/.*"\(sha256:[a-f0-9]\{64\}\)".*/\1/p;}' ../crates/nap-core/src/server/version.rs)"
          LORE_ARTIFACT_MANIFEST_URL="$(sed -n '/^pub const PINNED_LORE_ARTIFACT_MANIFEST_URL: &str =/,/";$/{s/.*"\(https:.*\)".*/\1/p;}' ../crates/nap-core/src/server/version.rs)"
          LORE_SIGNATURE_BUNDLE_URL="$(sed -n '/^pub const PINNED_LORE_SIGNATURE_BUNDLE_URL: &str =/,/";$/{s/.*"\(https:.*\)".*/\1/p;}' ../crates/nap-core/src/server/version.rs)"
          EXPECTED_LORE_RELEASE_BASE="https://github.com/portalshq/lore/releases/download/v${LORE_VERSION}"
          [[ "$LORE_INSTALLER_SHA256" =~ ^[a-f0-9]{64}$ ]] || { echo "Lore installer checksum is incomplete" >&2; exit 1; }
          [[ "$LORE_ARTIFACT_MANIFEST_SHA256" =~ ^sha256:[a-f0-9]{64}$ ]] || { echo "Lore artifact manifest is not pinned" >&2; exit 1; }
          [[ "$LORE_ARTIFACT_MANIFEST_URL" == "${EXPECTED_LORE_RELEASE_BASE}/SHA256SUMS" ]] || { echo "Lore artifact manifest URL is not trusted" >&2; exit 1; }
          [[ "$LORE_SIGNATURE_BUNDLE_URL" == "${EXPECTED_LORE_RELEASE_BASE}/SHA256SUMS.sigstore.json" ]] || { echo "Lore artifact signature bundle is not trusted" >&2; exit 1; }
          MANIFEST_SHA256="sha256:$(sha256sum SHA256SUMS | cut -d ' ' -f1)"
          jq -n \
            --arg version "$VERSION" \
            --arg release_tag "$RELEASE_TAG" \
            --arg source_commit "$SOURCE_COMMIT" \
            --arg security_contract "lore-auth-v1" \
            --arg artifact_manifest_sha256 "$MANIFEST_SHA256" \
            --arg lore_client_repository "$LORE_REPOSITORY" \
            --arg lore_client_version "$LORE_VERSION" \
            --arg lore_client_installer_sha256 "$LORE_INSTALLER_SHA256" \
            --arg lore_client_artifact_manifest_url "$LORE_ARTIFACT_MANIFEST_URL" \
            --arg lore_client_artifact_manifest_sha256 "$LORE_ARTIFACT_MANIFEST_SHA256" \
            --arg lore_client_signature_bundle_url "$LORE_SIGNATURE_BUNDLE_URL" \
            '{schema_version: 1, version: $version, release_tag: $release_tag,
              source_commit: $source_commit, security_contract: $security_contract,
              artifact_manifest_sha256: $artifact_manifest_sha256,
              lore_client_repository: $lore_client_repository,
              lore_client_version: $lore_client_version,
              lore_client_installer_sha256: $lore_client_installer_sha256,
              lore_client_artifact_manifest_url: $lore_client_artifact_manifest_url,
              lore_client_artifact_manifest_sha256: $lore_client_artifact_manifest_sha256,
              lore_client_signature_bundle_url: $lore_client_signature_bundle_url}' > release-metadata.json
          cosign sign-blob --yes --bundle release-metadata.sigstore.json release-metadata.json
      - uses: softprops/action-gh-release@v2
        with:
          overwrite_files: true
          generate_release_notes: true
          files: |
            artifacts/*
