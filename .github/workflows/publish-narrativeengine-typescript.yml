name: publish-narrativeengine-typescript

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: "https://registry.npmjs.org"
          cache: npm
          cache-dependency-path: typescript/narrativeengine/package-lock.json
      - uses: arduino/setup-protoc@v3
        with:
          version: "34.1"
      - run: npm ci
        working-directory: typescript/narrativeengine
      - run: npm run generate
        working-directory: typescript/narrativeengine
      - run: git diff --exit-code -- typescript/narrativeengine/src/generated
      - run: npm run lint
        working-directory: typescript/narrativeengine
      - run: npm run typecheck
        working-directory: typescript/narrativeengine
      - run: npm test
        working-directory: typescript/narrativeengine
      - run: npm run build
        working-directory: typescript/narrativeengine
      - run: npm publish --provenance --access public
        working-directory: typescript/narrativeengine
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
